<meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />


<div class="breadcrum">
    <ul>
        <li><b>APS Menu</b></li>
        <li>
            <img alt="breadcrum_right" width="14px" src="../../../assets/img/breadcrum_right.svg" />
        </li>
        <li>Erroneous Queue</li>
    </ul>
</div>


<section class="pt-0 pb-0 debt_position_modules">
    <div class="container-fluid">
        <div class="debt_position_Upload">

            <div class="debt_position_Upload_filter custom_filter">
                <form [formGroup]="form">
                    <div class="row align-items-end">

                        <div class="col-md-2 pr-0">
                            <div class="application_field">
                                <label for="companyId">Company Name</label>
                                <mat-select formControlName="companyId" placeholder="Select Company Name">
                                    <mat-option *ngFor="let company of companyList" [value]="company.id">
                                        {{company.name}}</mat-option>
                                </mat-select>
                            </div>
                        </div>


                        <div class="col-md-2 pr-0">
                            <div class="application_field">
                                <label for="searchText">Search</label>
                                <input type="text" formControlName="searchText" placeholder="Enter Search">
                            </div>
                        </div>


                        <div class="col-md-2" style="max-width: 15%;">
                            <div class="common_btn justify-content-start">
                                <button mat-raised-button color="primary" (click)="onSearch()">Search</button>
                                <button mat-raised-button color="primary" (click)="onReset()">Reset</button>
                                <a  (click)="onExcelDownload()">
                                    <img width="22px" alt="Excel" src="../../../assets/img/excel.svg">
                                </a>
                            </div>
                        </div>


                    </div>
                </form>
            </div>


            <div class="dashboard_tab">
                <div class="Inbox_tab_content">
                    <div class="position_Upload_table mt-0" style="height: auto;">
                        <ag-grid-angular id="ocrverification" #ocrverification
                            style="width: 100%;height: calc(100vh - 180px);" [class]="themeClass" [headerHeight]="31"
                            [rowHeight]="28" [pagination]="true" [suppressRowClickSelection]="true" [animateRows]="true"
                            [rowData]="rowData" [columnDefs]="colDefs" [gridOptions]="gridOptions"
                            [paginationPageSize]="20" (gridReady)="onGridReady($event)"></ag-grid-angular>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
