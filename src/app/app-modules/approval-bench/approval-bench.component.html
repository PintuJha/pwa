<meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />



<div class="breadcrum">
    <ul>
        <li><b>APS Menu</b></li>
        <li>
            <img alt="breadcrum_right" width="14px" src="../../../assets/img/breadcrum_right.svg" />
        </li>
        <li>Workflow Approval</li>
    </ul>
</div>



<section class="pt-0 pb-0 debt_position_modules">
    <div class="container-fluid">
        <div class="debt_position_Upload">

            <div class="debt_position_Upload_filter">
                <form>
                    <div class="row align-items-end">

                        <div class="col-md-3 pr-0">
                            <div class="application_field">
                                <label>Company-Site</label>
                                <mat-select placeholder="Select Company-Site">
                                    <mat-option value="0">All</mat-option>
                                </mat-select>
                            </div>
                        </div>

                        <div class="col-md-3 pr-0">
                            <div class="application_field">
                                <label>Staging Date Range</label>
                                <div class="date">
                                    <mat-date-range-input [rangePicker]="picker">
                                        <input matStartDate formControlName="start" placeholder="Start date">
                                        <input matEndDate formControlName="end" placeholder="End date">
                                    </mat-date-range-input>
                                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                                    <mat-date-range-picker #picker></mat-date-range-picker>
                                </div>

                            </div>
                        </div>

                        <!-- <div class="col-md-2 pr-0">
                            <div class="application_field">
                                <label>RPA Status</label>
                                <mat-select placeholder="Select RPA Status">
                                    <mat-option value="0">All</mat-option>
                                </mat-select>
                            </div>
                        </div> -->

                        <!-- <div class="col-md-2 pr-0">
                            <div class="application_field">
                                <label>File Status</label>
                                <mat-select placeholder="Select File Status" multiple>
                                    <mat-option value="0">All</mat-option>
                                    <mat-option value="1">Approved</mat-option>
                                    <mat-option value="2">Matched</mat-option>
                                </mat-select>
                            </div>
                        </div> -->

                        <div class="col-md-3 pr-0">
                            <div class="application_field">
                                <label>Search</label>
                                <input type="text" formControlName="searchText" placeholder="Enter Search">
                            </div>
                        </div>

                        <div class="col-md-2">
                            <div class="common_btn justify-content-start">
                                <button mat-raised-button color="primary">Search</button>
                                <button mat-raised-button color="primary">Reset</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>


            <div class="Inbox_tab_content">
                <div class="position_Upload_table mt-0" style="height: auto;">
                    <ag-grid-angular id="ocrverification" #ocrverification
                        style="width: 100%;height: calc(100vh - 222px);" [class]="themeClass" [headerHeight]="31"
                        [rowHeight]="28" [pagination]="true" [suppressRowClickSelection]="true" [animateRows]="true"
                        [rowData]="rowData" [columnDefs]="colDefs" [gridOptions]="gridOptions"></ag-grid-angular>
                </div>

                <div class="debt_position_Upload_filter pt-1 pb-0">
                    <form>
                        <div class="row align-items-center">

                            <div class="col-md-3 pr-0">
                                <div class="application_field">
                                    <mat-radio-group aria-label="Select an option" [value]="'1'">
                                        <mat-radio-button value="1">Approve</mat-radio-button>
                                        <mat-radio-button value="2">Return</mat-radio-button>
                                        <mat-radio-button value="3">Reject</mat-radio-button>
                                    </mat-radio-group>
                                </div>
                            </div>

                            <div class="col-md-5 pr-0">
                                <div class="application_field">
                                    <input type="text" formControlName="searchText" placeholder="Enter Your Remarks">
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="common_btn justify-content-start">
                                    <button mat-raised-button color="primary">Submit</button>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="common_btn justify-content-end">
                                    <p class="mb-0 records">Total No. of Records : <b>20</b></p>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>





        </div>
    </div>
</section>
